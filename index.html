<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة المقبولين الجدد</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 30px 20px;
            border-top: 5px solid #800020;
        }
        .logo {
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
            border-radius: 50%;
        }
        h2 {
            color: #800020;
            font-size: 20px;
            margin-bottom: 8px;
        }
        h1 {
            color: #222;
            font-size: 22px;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #800020;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #600018;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ضع رابط الشعار أو اللوجو الخاص بك هنا -->
        <img src="https://via.placeholder.com/110" alt="Logo" class="logo">

        <h2>جامعة المنصورة الجديدة</h2>
        <h1>دعوة الطلاب المقبولين الجدد</h1>
        <p class="subtitle">كلية الطب • دفعة 2026</p>

        <!-- استبدل الرابط أدناه برابط جروب التليجرام الخاص بك -->
        <a href="https://t.me/med1azhar" class="btn">الانضمام إلى التليجرام</a>

        <div class="footer">
            Faculty of Medicine • New Mansoura University
        </div>
    </div>

</body>
</html>
